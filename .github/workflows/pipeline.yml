name: CI/CD Pipeline

on: [push]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Run Tests
      run: |
        pip install -r requirements.txt
        pytest test_app.py

    - name: Build and Push Docker Image
      run: |
        echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/student-grade-app:${{ github.sha }} .
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/student-grade-app:${{ github.sha }}
