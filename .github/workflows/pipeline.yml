name: CI/CD Pipeline

on: [push]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Run Tests
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        python -m pytest test_app.py

    - name: Build and Push Docker Image
      run: |
        echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "ankitashoksharma2024" --password-stdin
        docker build -t ankitashoksharma2024/student-grade-app:${{ github.sha }} .
        docker push ankitashoksharma2024/student-grade-app:${{ github.sha }}
