apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-grade-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-grade
  template:
    metadata:
      labels:
        app: student-grade
    spec:
      containers:
      - name: grade-calculator
        image: ankitashoksharma2024/student-grade-app:19050029e64940f7593d4919d6d9e4e5696f13a6
        stdin: true
        tty: true
---
apiVersion: v1
kind: Service
metadata:
  name: student-grade-service
spec:
  type: NodePort
  selector:
    app: student-grade
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
